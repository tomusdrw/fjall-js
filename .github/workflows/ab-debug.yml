name: AB debug (temporary)
on:
  pull_request:
    branches: [main]
jobs:
  curve:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci && npx napi build --platform --release -o dist
      - name: Growth curve
        run: |
          cat > curve.mjs <<'JS'
          import { mkdtempSync } from 'node:fs';
          import { tmpdir } from 'node:os';
          import { join } from 'node:path';
          import { randomBytes } from 'node:crypto';
          import { open } from './dist/index.js';
          const dir = mkdtempSync(join(tmpdir(), 'curve-'));
          const size = Number(process.argv[2]);
          const value = randomBytes(size), key = Buffer.from('k');
          const cycle = async () => { const ks = await open({ path: dir }); const p = await ks.partition('p'); await p.insert(key, value); await ks.persist(); await ks.close(); };
          for (let i = 0; i < 5; i++) await cycle();
          const base = process.memoryUsage().rss; const out = [];
          for (let i = 1; i <= 200; i++) { await cycle(); if (i % 25 === 0) out.push(((process.memoryUsage().rss - base) / 1048576).toFixed(0)); }
          console.log(`value=${size} growth_MB@25..200:`, out.join(' '));
          JS
          node curve.mjs 2097152
          node curve.mjs 2097152
          node curve.mjs 65536
          node --expose-gc -e "0" && echo ok
