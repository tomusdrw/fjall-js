[package]
name = "fjall-js"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Node.js bindings for the fjall LSM-tree storage engine"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# NOTE: intentionally NO "async"/"tokio_rt" features. Those route every
# `#[napi] async fn` through a process-global tokio runtime + a cross-thread
# ThreadSafeFunction deferred, which crashes under concurrent Node worker_threads
# Envs. We use napi `Task`/`AsyncTask` (libuv per-Env async work) instead.
# See src/lib.rs and .context/ROOT_CAUSE.md.
napi = { version = "2", default-features = false, features = ["napi9"] }
napi-derive = "2"
fjall = "2"

# fjall 2.11.2 has two bugs in `delete_partition` when a background flush of the
# same partition is in flight (hit by repeated delete+recreate "reset" cycles):
#   1. the flush worker panics in `FlushQueue::dequeue` and poisons the shared
#      flush-manager lock for the whole engine, and
#   2. the partition's directory stays pinned by journal eviction-watermark
#      clones, so re-opening the name fails with `PartitionDeleted`.
# Both are fixed in our fork branch (pinned by rev for reproducible CI builds).
# Upstream is 2.11.2 (highest 2.x); 3.x is a breaking rewrite. Revisit on bump.
# See __test__/delete-partition-recreate.test.ts for the regression.
[patch.crates-io]
fjall = { git = "https://github.com/tomusdrw/fjall", rev = "645bf5ecf833baf60a7ce63cb29289689706f769" }

[build-dependencies]
napi-build = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
